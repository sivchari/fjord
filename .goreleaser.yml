version: 2

project_name: fjord

before:
  hooks:
    - go mod tidy

# Both builds run on a macOS runner: darwin needs cgo (rask binds
# Virtualization.framework) and a codesign step, while linux cross-compiles
# from there for free with CGO_ENABLED=0.
builds:
  - id: fjord-linux
    main: ./cmd/fjord
    binary: fjord
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

  - id: fjord-darwin
    main: ./cmd/fjord
    binary: fjord
    # cgo: rask's vz substrate calls Virtualization.framework, so this only
    # builds on macOS and only for Apple silicon.
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    hooks:
      post:
        # Ad-hoc sign with com.apple.security.virtualization. Without it the
        # VM starts but its guest never becomes reachable, and the failure
        # surfaces minutes later as an unrelated-looking timeout.
        - codesign --entitlements vz.entitlements -f -s - "{{ .Path }}"

archives:
  - id: fjord
    formats: ['tar.gz']
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
    ids:
      - fjord-linux
      - fjord-darwin

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc

release:
  use_existing_draft: true
