name: Build Node Images

on:
  push:
    branches:
      - main
    paths:
      - internal/eksd/generated_table.go
  workflow_dispatch:
    inputs:
      eks_version:
        description: 'Build a single EKS minor version (e.g. 1.33). Leave empty to build every supported version.'
        required: false
        type: string

permissions:
  packages: write
  contents: read

jobs:
  matrix:
    name: Resolve version matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - id: set
        run: |
          if [ -n "${{ inputs.eks_version }}" ]; then
            echo 'versions=["${{ inputs.eks_version }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["1.29","1.30","1.31","1.32","1.33","1.34","1.35","1.36"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.version }} (${{ matrix.arch }})
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build node image
        run: go run ./cmd/fjord build node-image --eks-version ${{ matrix.version }} --arch ${{ matrix.arch }}

      - name: Retag and push
        run: |
          TAG=$(docker images 'ghcr.io/sivchari/fjord/node' --format '{{.Repository}}:{{.Tag}}')
          docker tag "$TAG" "${TAG}-${{ matrix.arch }}"
          docker push "${TAG}-${{ matrix.arch }}"

  manifest:
    name: Manifest ${{ matrix.version }}
    needs: [matrix, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve image tag
        id: tag
        run: |
          VERSION="${{ matrix.version }}"
          read -r CHANNEL NUMBER KUBE_VERSION < <(awk -v key="\"${VERSION}\":" '
            $1 == key { flag=1; next }
            flag && $1 ~ /^"[0-9]/ { exit }
            flag && $1 == "Channel:"      { gsub(/[",]/, "", $2); channel=$2 }
            flag && $1 == "Number:"       { gsub(/[",]/, "", $2); number=$2 }
            flag && $1 == "KubeVersion:"  { gsub(/[",]/, "", $2); kube=$2 }
            END { print channel, number, kube }
          ' internal/eksd/generated_table.go)

          if [ -z "$CHANNEL" ] || [ -z "$NUMBER" ] || [ -z "$KUBE_VERSION" ]; then
            echo "could not resolve release info for version ${VERSION}" >&2
            exit 1
          fi

          FULL_TAG="ghcr.io/sivchari/fjord/node:${KUBE_VERSION}-eks-${CHANNEL}-${NUMBER}"
          echo "full_tag=${FULL_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${{ steps.tag.outputs.full_tag }}" \
            -t "ghcr.io/sivchari/fjord/node:${{ matrix.version }}" \
            "${{ steps.tag.outputs.full_tag }}-amd64" \
            "${{ steps.tag.outputs.full_tag }}-arm64"
