name: Smoke E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

jobs:
  smoke-e2e:
    name: Smoke E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Cache EKS-D server tarballs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fjord
          key: eksd-tarball-${{ hashFiles('internal/eksd/generated_table.go') }}

      - name: Run integration tests
        # sudo: rask's hostproc substrate supervises the control plane as
        # host processes owning host networking, which requires root.
        run: sudo -E env "PATH=$PATH" make test-integration
