name: Build Agent Image

on:
  push:
    branches:
      - main
    paths:
      - cmd/fjord-agent/**
      - internal/agent/**
      - internal/authn/**
      - internal/pki/**
      - docker/**
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  packages: write
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build agent image
        run: go run ./cmd/fjord build agent-image --arch ${{ matrix.arch }} --local

      - name: Retag and push
        run: |
          TAG=$(docker images 'ghcr.io/sivchari/fjord/agent' --format '{{.Repository}}:{{.Tag}}')
          docker tag "$TAG" "${TAG}-${{ matrix.arch }}"
          docker push "${TAG}-${{ matrix.arch }}"

  manifest:
    name: Manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve image tag
        id: tag
        run: |
          VERSION=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version.go)

          if [ -z "$VERSION" ]; then
            echo "could not resolve fjord version from version.go" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/sivchari/fjord/agent:${{ steps.tag.outputs.version }}" \
            -t "ghcr.io/sivchari/fjord/agent:latest" \
            "ghcr.io/sivchari/fjord/agent:${{ steps.tag.outputs.version }}-amd64" \
            "ghcr.io/sivchari/fjord/agent:${{ steps.tag.outputs.version }}-arm64"
